services:
  debatesApp-postgres:
    image: postgres:18.3-bookworm
    container_name: env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
  
  debatesApp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: postgres-port-forwarder
    command: TCP-LISTEN:5432,reuseaddr,fork TCP:env-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - default
  minio:
    image: minio/minio:latest
    container_name: debatesApp-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/miniodata:/data
    command: server /data --console-address ":9001"